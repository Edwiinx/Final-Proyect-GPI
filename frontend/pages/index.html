<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>West Clean — Foro de reportes</title>
  <!-- HEAD: colocar lo siguiente lo más arriba posible -->
<script>
  (function(){
    try {
      var t = localStorage.getItem('wc_theme_mode');
      if (!t) {
        // usa preferencia del sistema por defecto si no hay guardado
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        else t = 'dark';
      }
      if (t === 'light') document.documentElement.classList.add('theme-light');
      else document.documentElement.classList.remove('theme-light');
    } catch(e){}
  })();
</script>


  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/index.css">
  <!-- incluir SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <meta name="theme-color" content="#0b0b0b">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-wc-surface sticky-top">
    <div class="container">
      <a class="navbar-brand" href="">West Clean</a>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <i class="bi bi-gear-fill"></i>
        <div class="dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" data-bs-toggle="dropdown">Mi cuenta</a>
          <span id="userName">Usuario</span>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="profile.html">Ver perfil</a></li>
            <li><button class="dropdown-item" id="logoutBtn">Cerrar sesión</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- FILTER / ACTIONS -->
  <div class="container py-3">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-lg-6">
        <div class="input-group">
          <span class="input-group-text bg-wc-surface border-0"><i class="bi bi-search"></i></span>
          <input id="searchInput" class="form-control form-control-wc" type="search" placeholder="Buscar..." aria-label="Buscar">
        </div>
      </div>
      <div class="col-12 col-lg-6 text-lg-end">
        <button id="quickCreateBtn" class="btn btn-wc-primary">Crear reporte</button>
      </div>
    </div>
  </div>

  <main class="container mb-5">
    <div class="row">
      <!-- POSTS -->
      <section class="col-12 col-lg-8">
        <div id="postsList" class="d-grid gap-3" aria-live="polite"></div>
        <div class="text-center mt-4">
          <button id="loadMoreBtn" class="btn btn-outline-wc">Cargar más</button>
        </div>
      </section>

      <!-- SIDEBAR -->
      <aside class="col-12 col-lg-4">
        <div class="card bg-wc-panel p-3 mb-3">
          <h6>Etiquetas</h6>
          <div id="tagsWrap" class="d-flex flex-wrap gap-2">
            <button class="btn btn-tag" data-tag="garbage">#garbage</button>
            <button class="btn btn-tag" data-tag="saneamiento">#saneamiento</button>
            <button class="btn btn-tag" data-tag="mantenimiento">#mantenimiento</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- CREATE REPORT MODAL -->
  <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-wc-panel">
        <div class="modal-header">
          <h5 class="modal-title">Crear reporte</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="createForm" novalidate>
            <div class="mb-3">
              <label for="r-title" class="form-label">Título</label>
              <input id="r-title" name="title" class="form-control form-control-wc" required>
            </div>
            <div class="mb-3">
              <label for="r-desc" class="form-label">Descripción</label>
              <textarea id="r-desc" name="description" class="form-control form-control-wc" rows="4" required></textarea>
            </div>
            <div class="mb-3 row g-2">
              <div class="col-6">
                <label for="r-tag" class="form-label">Etiqueta</label>
                <select id="r-tag" name="tag" class="form-select form-control-wc">
                  <option value="garbage">#garbage</option>
                  <option value="saneamiento">#saneamiento</option>
                  <option value="mantenimiento">#mantenimiento</option>
                </select>
              </div>
              <div class="col-6">
                <label for="r-photo" class="form-label">Foto (opcional)</label>
                <input id="r-photo" name="photo" type="file" accept="image/*" class="form-control form-control-wc">
                <div id="photoPreview" class="mt-2" aria-hidden="true"></div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button data-bs-dismiss="modal" class="btn btn-outline-wc">Cancelar</button>
          <button id="submitCreate" class="btn btn-wc-primary">Publicar</button>
        </div>
      </div>
    </div>
  </div>

  <template id="postTemplate">
    <article class="card post-card bg-wc-panel border-0">
      <div class="row g-0 align-items-start">
        <div class="col-auto d-none d-md-flex vote-col p-3 flex-column align-items-center">
          <button class="btn btn-ghost-vote btn-vote-up" aria-label="Votar positivo" data-action="vote-up">▲</button>
          <div class="score fw-semibold">0</div>
          <button class="btn btn-ghost-vote btn-vote-down" aria-label="Votar negativo" data-action="vote-down">▼</button>
        </div>
        <div class="col">
          <div class="card-body">
            <a class="badge bg-wc-green tag" href="#"></a>
            <h5 class="card-title mb-1"><a class="post-link text-decoration-none" href="#"></a></h5>
            <div class="text-muted small meta"></div>
            <p class="card-text text-muted excerpt mb-2"></p>
            <div class="post-media mb-2" style="display:none"><img class="img-fluid rounded" alt=""></div>
            <div class="d-flex gap-2 actions">
              <button class="btn btn-outline-wc btn-sm btn-comment" data-action="comment"><i class="bi bi-chat-left-text me-1"></i>0</button>
              <button class="btn btn-outline-wc btn-sm btn-share" data-action="share"><i class="bi bi-share-fill me-1"></i>Compartir</button>
            </div>
          </div>
        </div>
      </div>
    </article>
  </template>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App script -->
  <script src="../js/index.js" defer></script>



<script>
async function fetchMe() {
  try {
    const res = await fetch('/Final-Proyect-GPI/backend/php/session.php?action=me', {
      method: 'GET',
      credentials: 'include'
    });
    // leer como JSON si posible
    const txt = await res.text();
    try {
      const data = JSON.parse(txt);
      return { res, data };
    } catch (err) {
      console.error('Respuesta no JSON de me:', txt);
      return { res, data: null };
    }
  } catch (err) {
    console.error('Error fetch me:', err);
    return { res: null, data: null, err };
  }
}

// Llamar al cargar la página
window.addEventListener('DOMContentLoaded', async () => {
  const { res, data } = await fetchMe();
  if (!res || !data) {
    // No se pudo comprobar, opcionalmente avisar en consola
    console.warn('No se pudo verificar sesión (me).');
    return;
  }

  if (!res.ok || !data.ok) {
    // No hay sesión activa -> redirigir al login opcionalmente
    console.log('No session active.');
    // Si deseas forzar login:
    // window.location.href = '/Final-Proyect-GPI/frontend/pages/login.html';
    return;
  }

  // Hay sesión -> colocar nombre en UI (coloca un span con id="userName" donde quieras mostrarlo)
  const nameEl = document.getElementById('userName');
  if (nameEl) nameEl.textContent = data.nombre || data.correo || 'Usuario';
});
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const logoutBtn = document.getElementById('logoutBtn');
  if (!logoutBtn) return;

  logoutBtn.addEventListener('click', async (ev) => {
    ev.preventDefault();

    const result = await Swal.fire({
      title: 'Cerrar sesión',
      text: '¿Estás seguro que quieres cerrar tu sesión?',
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Sí, salir',
      cancelButtonText: 'Cancelar',
      backdrop: `rgba(0,0,0,0.45) blur(4px)`,
      customClass: { popup: 'swal2-rounded' }
    });

    if (!result.isConfirmed) return;

    try {
      const res = await fetch('/Final-Proyect-GPI/backend/php/session.php?action=logout', {
        method: 'POST', // puede ser GET también, usamos POST por convención
        credentials: 'include'
      });
      const data = await res.json();

      if (res.ok && data.ok) {
        await Swal.fire({
          title: 'Sesión cerrada',
          text: 'Has salido correctamente',
          icon: 'success',
          timer: 1300,
          showConfirmButton: false,
          backdrop: `rgba(0,0,0,0.45) blur(4px)`
        });
        // redirigir a login o a la homepage pública
        window.location.href = '/Final-Proyect-GPI/frontend/pages/login.html';
      } else {
        Swal.fire('Error', data.error || 'No se pudo cerrar sesión', 'error');
      }
    } catch (err) {
      console.error('Logout error', err);
      Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
    }
  });
});
</script>


</body>
</html>
