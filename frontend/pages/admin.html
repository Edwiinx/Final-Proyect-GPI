<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>West Clean — Panel administrativo</title>

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/admin.css">

  <meta name="theme-color" content="#0b0b0b">
</head>
<body class="wc-bg">

  <!-- Topbar -->
  <header class="wc-topbar py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="brand d-flex align-items-center gap-2">
          <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#0b0b0b"/><path d="M6 12c1.6-2 3-4 6-4s4.4 2 6 4c-1.6 2-3 4-6 4s-4.4-2-6-4z" fill="#00b894"/></svg>
          <strong class="text-white">West Clean</strong>
        </a>
        <div class="ms-3 text-muted small">Panel administrativo</div>
      </div>

      <div class="d-flex gap-2 align-items-center">
        <input id="adminSearch" class="form-control form-control-sm search-input" placeholder="Buscar reportes, usuario, etiqueta..." />
        <button id="logoutBtn" class="btn btn-sm btn-ghost-wc">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="container py-4">
    <div class="row g-3">

      <!-- Sidebar filters -->
      <aside class="col-12 col-lg-3">
        <div class="card wc-panel p-3">
          <h6 class="mb-3">Filtros</h6>

          <label class="form-label small">Estado</label>
          <select id="filterStatus" class="form-select form-select-sm mb-3">
            <option value="all">Todos</option>
            <option value="nuevo">Nuevo</option>
            <option value="en_proceso">En proceso</option>
            <option value="hecho">Hecho</option>
            <option value="sin_realizar">Sin realizar</option>
          </select>

          <label class="form-label small">Etiqueta</label>
          <select id="filterTag" class="form-select form-select-sm mb-3">
            <option value="all">Todas</option>
            <option value="garbage">#garbage</option>
            <option value="saneamiento">#saneamiento</option>
            <option value="mantenimiento">#mantenimiento</option>
            <option value="iluminacion">#iluminacion</option>
          </select>

          <label class="form-label small">Ordenar por</label>
          <select id="sortBy" class="form-select form-select-sm mb-3">
            <option value="recent">Más recientes</option>
            <option value="votes">Más votados</option>
            <option value="comments">Más comentados</option>
          </select>

          <div class="d-grid">
            <button id="applyFilters" class="btn btn-wc-primary btn-sm">Aplicar</button>
          </div>
        </div>

        <div class="mt-3 card wc-panel p-3">
          <h6 class="mb-2">Acciones rápidas</h6>
          <button id="createFake" class="btn btn-outline-wc btn-sm w-100 mb-2">Agregar reporte demo</button>
          <button id="clearAll" class="btn btn-ghost-wc btn-sm w-100">Limpiar storage (tests)</button>
        </div>
      </aside>

      <!-- Reports list -->
      <section class="col-12 col-lg-9">
        <div id="reportsWrap" class="d-grid gap-3"></div>

        <div class="text-center mt-3">
          <button id="loadMore" class="btn btn-outline-wc btn-sm">Cargar más (demo)</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Edit / View Modal -->
  <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content bg-wc-panel border-0">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Reporte</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editId" />
            <div class="mb-3">
              <label class="form-label">Título</label>
              <input id="editTitle" class="form-control form-control-wc" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea id="editDesc" class="form-control form-control-wc" rows="4" required></textarea>
            </div>
            <div class="row g-2 mb-3">
              <div class="col">
                <label class="form-label">Etiqueta</label>
                <select id="editTag" class="form-select form-select-sm">
                  <option value="garbage">#garbage</option>
                  <option value="saneamiento">#saneamiento</option>
                  <option value="mantenimiento">#mantenimiento</option>
                  <option value="iluminacion">#iluminacion</option>
                </select>
              </div>
              <div class="col">
                <label class="form-label">Estado</label>
                <select id="editStatus" class="form-select form-select-sm">
                  <option value="nuevo">Nuevo</option>
                  <option value="en_proceso">En proceso</option>
                  <option value="hecho">Hecho</option>
                  <option value="sin_realizar">Sin realizar</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Comentarios</label>
              <div id="commentsList" class="comments-list mb-2"></div>
              <div class="d-flex gap-2">
                <input id="newCommentInput" class="form-control form-control-sm" placeholder="Agregar comentario..." />
                <button id="addCommentBtn" class="btn btn-wc-primary btn-sm">Agregar</button>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-wc" data-bs-dismiss="modal">Cerrar</button>
              <button type="submit" class="btn btn-wc-primary">Guardar cambios</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content bg-wc-panel border-0 p-3 text-center">
        <h6 class="mb-3">Eliminar reporte</h6>
        <p class="text-muted small mb-3">¿Estás seguro? Esta acción no se puede deshacer (en demo solo borra local).</p>
        <div class="d-flex gap-2 justify-content-center">
          <button id="cancelDelete" class="btn btn-outline-wc btn-sm" data-bs-dismiss="modal">Cancelar</button>
          <button id="confirmDelete" class="btn btn-wc-primary btn-sm">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap + script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js" defer></script>
</body>
</html>
