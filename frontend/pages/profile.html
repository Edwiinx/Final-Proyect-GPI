  <!-- HEAD: colocar lo siguiente lo más arriba posible -->
<script>
  (function(){
    try {
      var t = localStorage.getItem('wc_theme_mode');
      if (!t) {
        // usa preferencia del sistema por defecto si no hay guardado
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        else t = 'dark';
      }
      if (t === 'light') document.documentElement.classList.add('theme-light');
      else document.documentElement.classList.remove('theme-light');
    } catch(e){}
  })();
</script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
async function getSessionUser() {
  try {
    const res = await fetch('/Final-Proyect-GPI/backend/php/session.php?action=me', {
      method: 'GET',
      credentials: 'include'
    });
    const txt = await res.text();

    try {
      const data = JSON.parse(txt);
      return { res, data };
    } catch(e) {
      console.error("Respuesta no JSON:", txt);
      return { res, data: null };
    }
  } catch (err) {
    console.error("Error en fetch me:", err);
    return { res: null, data: null };
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  const { res, data } = await getSessionUser();

  // 🔴 SI NO HAY SESIÓN → VUELVE AL LOGIN
  if (!res || !data || !data.ok) {
    Swal.fire({
      title: "Sesión expirada",
      text: "Debe iniciar sesión nuevamente.",
      icon: "warning",
      timer: 1500,
      showConfirmButton: false
    }).then(() => {
      window.location.href = "/Final-Proyect-GPI/frontend/pages/login.html";
    });
    return;
  }

  // 🟢 CARGAR DATOS EN EL PERFIL
  document.getElementById("profileName").textContent = data.nombre;
  document.getElementById("profileHandle").innerHTML = 
      "@" + data.correo.split('@')[0] + 
      " · <span id='profileStats'>0 publicaciones</span>";

  // Si más adelante guardas avatar en DB:
  // document.getElementById("profileAvatar").src = data.avatar;

  // Cargar publicaciones del usuario (placeholder por ahora)
  loadUserPosts(data.id);

  // Cargar estadísticas (placeholder)
  loadProfileStats(data.id);
});

// --------------------------
// PUBLICACIONES DEL USUARIO
// --------------------------
async function loadUserPosts(userId) {
  // Aquí llamarías a tu backend:
  // fetch("logica.php?action=getUserPosts&user_id=" + userId)

  // Por ahora, simulado:
  const posts = [
    { title: "Reporte en Área A", excerpt: "Derrame detectado en zona A1…", tag: "Reporte", time: "Hace 2h" },
    { title: "Limpieza completada", excerpt: "Tarea finalizada correctamente.", tag: "Limpieza", time: "Ayer" }
  ];

  const feed = document.getElementById("profileFeed");
  const tpl = document.getElementById("profilePostTpl");

  feed.innerHTML = "";

  posts.forEach(p => {
    const node = tpl.content.cloneNode(true);
    node.querySelector(".title-link").textContent = p.title;
    node.querySelector(".excerpt").textContent = p.excerpt;
    node.querySelector(".tag").textContent = p.tag;
    node.querySelector(".meta").textContent = p.time;
    feed.appendChild(node);
  });

  // actualizar contador
  document.getElementById("profileStats").textContent = posts.length + " publicaciones";
}

</script>
